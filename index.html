<style>
/* Layout: one-column phone app, sticky top bar, three-step flow, course rendered as a route line */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --fg: #1d2a38;
  --muted: #5b6b7c;
  --line: #d9e0e8;
  --navy: #1a3a5c;
  --blue: #2e6da4;
  --blue-soft: #e3edf7;
  --orange: #c98a00;
  --orange-soft: #fbf0d6;
  --green: #3f7a5a;
  --green-soft: #e2efe7;
  --t-nt: #6b5b95; --t-nf: #3f7a5a; --t-sj: #2e6da4; --t-sp: #b5651d;
  --font-display: "Do Hyeon", "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1823; --surface: #172333; --fg: #e6ecf2; --muted: #9aabbc; --line: #2a3a4d;
    --navy: #9cc3e8; --blue: #6fa6d8; --blue-soft: #1d3149; --orange: #e0b04a; --orange-soft: #33291a;
    --green: #7fbf98; --green-soft: #1b3125;
    --t-nt: #a898d2; --t-nf: #7fbf98; --t-sj: #6fa6d8; --t-sp: #e0a066;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1823; --surface: #172333; --fg: #e6ecf2; --muted: #9aabbc; --line: #2a3a4d;
  --navy: #9cc3e8; --blue: #6fa6d8; --blue-soft: #1d3149; --orange: #e0b04a; --orange-soft: #33291a;
  --green: #7fbf98; --green-soft: #1b3125;
  --t-nt: #a898d2; --t-nf: #7fbf98; --t-sj: #6fa6d8; --t-sp: #e0a066;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font-body); -webkit-tap-highlight-color: transparent; }
.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 0 96px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: .01em; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.brand { display: grid; gap: 4px; min-width: 0; }
/* 로고 원본(2171x724)의 바깥 흰 여백을 잘라 글자 부분만 보이게 한다 */
.brand .logo { display: block; width: 166px; height: 50px; overflow: hidden; border-radius: 6px; }
.brand .logo img { display: block; width: 200px; height: auto; margin: -8px 0 0 -18px; }
.brand small { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand .logo { background: #fff; } }
:root[data-theme="dark"] .brand .logo { background: #fff; }
.tools { display: grid; justify-items: end; gap: 8px; }
.lang { font-size: 12px; font-weight: 800; color: var(--blue); text-decoration: none; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); }
.steps { display: flex; gap: 6px; }
.steps span { width: 26px; height: 6px; border-radius: 3px; background: var(--line); }
.steps span.on { background: var(--blue); }

.screen { padding-top: 20px; display: grid; gap: 18px; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--blue); text-transform: uppercase; }
.lead { color: var(--muted); margin: 6px 0 0; }
.hero h1 { font-size: 34px; line-height: 1.15; color: var(--navy); }
.hero h1 em { font-style: normal; color: var(--orange); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.section-title { font-family: var(--font-display); font-size: 19px; margin-bottom: 10px; color: var(--navy); }
.hint { font-size: 13px; color: var(--muted); margin: -4px 0 10px; }

/* MBTI axis toggles */
.axis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.axis + .axis { margin-top: 8px; }
.opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; min-height: 56px; display: grid; gap: 2px; }
.opt b { font-size: 18px; font-family: var(--font-display); font-weight: 400; color: var(--navy); }
.opt span { font-size: 12px; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
.linkbtn { background: none; border: 0; color: var(--blue); font-weight: 600; padding: 8px 0 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.quiz { display: grid; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.quiz p { margin: 0 0 6px; font-weight: 600; }

/* chips */
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chips.two { grid-template-columns: repeat(2, 1fr); }
.chips.four { grid-template-columns: repeat(4, 1fr); }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px; cursor: pointer; display: grid; justify-items: center; gap: 4px; font-size: 13px; font-weight: 600; min-height: 48px; align-content: center; }
.chip svg { width: 22px; height: 22px; stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.chip[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--navy); }
.chip[aria-pressed="true"] svg { stroke: var(--blue); }
.chip small { font-weight: 400; font-size: 11px; color: var(--muted); }
.field + .field { margin-top: 16px; }
.field label.lbl { display: block; font-weight: 800; font-size: 13px; margin-bottom: 8px; }

/* bottom action bar */
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.actionbar .inner { max-width: 448px; margin: 0 auto; display: flex; gap: 8px; }
.btn { flex: 1; border: 0; border-radius: 12px; padding: 14px; font-weight: 800; cursor: pointer; background: var(--navy); color: var(--surface); }
.btn.ghost { flex: 0 0 auto; background: var(--blue-soft); color: var(--navy); padding-inline: 18px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* intro example */
.sample { display: grid; gap: 10px; }
.sample .tag { justify-self: start; font-size: 11px; font-weight: 800; letter-spacing: .08em; background: var(--orange-soft); color: var(--orange); padding: 3px 8px; border-radius: 6px; }
.flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.flow div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; font-size: 13px; min-width: 0; }
.flow b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 15px; color: var(--navy); }
.flow .n { font-size: 11px; font-weight: 800; color: var(--blue); letter-spacing: .1em; }

/* result */
.typecard { border-radius: var(--radius); padding: 18px; color: var(--surface); background: var(--tc, var(--navy)); display: grid; gap: 6px; }
.typecard .code { font-family: var(--font-display); font-size: 46px; line-height: 1; }
.typecard .nm { font-weight: 800; }
.typecard p { margin: 0; opacity: .92; font-size: 14px; }
.plog { display: grid; gap: 10px; }
.scale { position: relative; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--orange), var(--blue), var(--green)); }
.scale i { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--navy); transform: translate(-50%, -50%); }
.scale-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

.route { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.daylabel { font-family: var(--font-display); font-size: 16px; color: var(--orange); padding: 6px 0 8px; }
.stop { display: grid; grid-template-columns: 34px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
.stop::before { content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
.stop:last-child::before { display: none; }
.num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--blue-soft); color: var(--navy); font-variant-numeric: tabular-nums; }
.stop.biz .num { background: var(--orange-soft); color: var(--orange); }
.stop .body { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.stop .kind { font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--blue); }
.stop.biz .kind { color: var(--orange); }
.stop h3 { font-size: 18px; margin: 2px 0 4px; }
.stop p { margin: 0; font-size: 13.5px; color: var(--muted); }
.stop .note { margin-top: 6px; font-size: 12px; color: var(--orange); font-weight: 600; }
.stop .why { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.maplink { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--blue); }

.values { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.val { border-radius: 12px; padding: 10px 12px; background: var(--green-soft); }
.val b { display: block; font-size: 12px; letter-spacing: .06em; color: var(--green); }
.val span { font-size: 13px; }
.val.off { background: var(--bg); opacity: .55; }

.mission { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.mission:first-of-type { border-top: 0; }
.mission input { width: 22px; height: 22px; accent-color: var(--blue); flex: 0 0 auto; }
.mission label { flex: 1; font-size: 14px; }
.mission .pt { font-weight: 800; color: var(--orange); font-variant-numeric: tabular-nums; }
.points { display: flex; justify-content: space-between; align-items: baseline; }
.points strong { font-family: var(--font-display); font-weight: 400; font-size: 30px; color: var(--orange); font-variant-numeric: tabular-nums; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 9; }
.copybox { width: 100%; min-height: 120px; font: 13px/1.5 var(--font-body); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
@media (prefers-reduced-motion: no-preference) {
  .screen { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media (max-width: 360px) { .chips.four { grid-template-columns: repeat(2, 1fr); } .hero h1 { font-size: 29px; } }
</style>

function plogLevel() {
  const c = mbtiCode(); let s = 0;
  if (c[0]==='E') s++; if (c[1]==='N') s++; if (c[3]==='P') s++;
  if (S.interests.includes('new')) s++; if (S.interests.includes('activity')) s++;
  if (S.interests.includes('healing')) s--; if (S.interests.includes('family')) s--;
  if (S.who==='가족') s--; if (S.move==='도보' || S.move==='자전거') s++;
  if (s <= -1) return 1; if (s <= 0) return 2; if (s <= 2) return 3; if (s === 3) return 4; return 5;
}
function rng(seed) { let x = seed * 9301 + 49297; return () => ((x = (x * 9301 + 49297) % 233280) / 233280); }
function scorePlace(id, p, type, lvl, rand) {
  let s = 0; const why = [];
  if (type.pl.includes(id)) { s += 6; why.push(mbtiCode() + ' 대표 관광지'); }
  const hit = p.tags.filter(t => S.interests.includes(t));
  s += hit.length * 2.5;
  hit.forEach(t => why.push(INTERESTS.find(i => i[0]===t)[1]));
  const vh = p.values.filter(v => S.values.includes(v));
  s += vh.length * 1.5;
  s -= Math.abs(p.adv - lvl) * 0.8;
  if (S.who==='가족') { if (p.tags.includes('family')) { s += 2; why.push('가족 여행'); } if (p.adv >= 5) s -= 1.5; }
  if ((S.who==='연인' || S.who==='혼자') && (p.tags.includes('photo') || p.tags.includes('healing'))) s += 1;
  if (S.who==='친구' && p.tags.includes('activity')) s += 1;
  if (S.budget==='저예산' && p.paid) s -= 3;
  if (S.budget==='여유' && p.paid) s += 1;
  if ((S.move==='도보' || S.move==='자전거') && p.tags.includes('nature')) s += 1;
  s += rand() * (S.seed ? 2.5 : 0.01);
  return {id, s, why: [...new Set(why)].slice(0, 3)};
}
const PLAN = {
  '2h':  [['spot','cafe']],
  half:  [['spot','food','spot']],
  day:   [['spot','food','spot','cafe','spot']],
  two:   [['spot','food','spot','cafe','spot'], ['spot','market','spot']]
};
function buildCourse() {
  const type = TYPES[mbtiCode()], lvl = plogLevel(), rand = rng(S.seed + 1);
  const ranked = Object.entries(PLACES).map(([id, p]) => scorePlace(id, p, type, lvl, rand)).sort((a, b) => b.s - a.s);
  const used = new Set();
  const pick = kinds => { const r = ranked.find(x => kinds.includes(PLACES[x.id].kind) && !used.has(x.id)); if (r) used.add(r.id); return r; };
  let plan = PLAN[S.time].map(d => d.slice());
  if (S.interests.includes('food') && S.time==='day') plan[0].push('market');
  return plan.map(day => day.map(k => {
    const kinds = k==='spot' ? ['spot'] : k==='market' ? ['market','food'] : k==='food' ? ['food','market'] : ['cafe'];
    return pick(kinds);
  }).filter(Boolean));
}

      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
      ${x.why.length ? `<div class="why">${x.why.map(w => `<span class="pill">${esc(w)}</span>`).join('')}</div>` : ''}
      <a class="maplink" href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">지도에서 보기 →</a></div></li>`;
  }).join('')).join('');
  const total = MISSIONS.reduce((a, m) => a + (S.done[m.id] ? m.p : 0), 0);
  store.set('last', {code, time: S.time});

  $('#view').innerHTML = `
  <section class="screen">
    <div class="typecard" style="--tc: var(--t-${group(code)})">
      <span class="code">${code}</span>
      <span class="nm">${type.nm} · ${type.tt}</span>
      <p>${S.who} · ${({'2h':'2시간','half':'반일','day':'1일','two':'1박 2일'})[S.time]} · ${S.move} · 예산 ${S.budget}</p>
      ${type.extra ? '<p style="font-size:12px">사례보고서의 14개 유형에 없는 유형이라 가까운 성향의 관광지로 구성했어요.</p>' : ''}
    </div>
    <div class="card plog">
      <div class="section-title" style="margin:0">관광객 유형 · ${pg[0]} <span style="font-size:13px;color:var(--muted)">${pg[1]}</span></div>
      <div class="scale" role="img" aria-label="플로그 관광객 유형 척도 ${lvl}/5"><i style="left:${(lvl-1)*25}%"></i></div>
      <div class="scale-l"><span>자기중심형</span><span>중간형</span><span>선중심형</span></div>
      <p style="margin:0;font-size:14px">${pg[2]}</p>
    </div>
    <div>
      <div class="section-title">추천 코스</div>
      <ol class="route">${stops}</ol>
      <p class="hint" style="margin:0">이동 동선과 운영 시간은 방문 전 지도에서 확인해 주세요.</p>
    </div>
    <div class="card">
      <div class="section-title">이 코스가 더하는 가치</div>
      <div class="values">${Object.entries(VALUES).map(([k, v]) => `<div class="val ${courseVals.has(k) ? '' : 'off'}"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('')}</div>
    </div>
    <div class="card">
      <div class="points"><div class="section-title" style="margin:0">TOGETHER POINT</div><strong id="pts">${total}P</strong></div>
      <p class="hint" style="margin:4px 0 6px">여행 중 미션을 완료하면 체크하세요. 포인트는 이 기기에만 저장되는 체험용입니다.</p>
      ${missions.map(m => `<div class="mission"><input type="checkbox" id="${m.id}" ${S.done[m.id] ? 'checked' : ''}><label for="${m.id}">${m.t}</label><span class="pt">+${m.p}</span></div>`).join('')}
    </div>
    <div class="card" id="sharebox" hidden>
      <div class="section-title">코스 공유 텍스트</div>
      <textarea class="copybox" id="copytext" readonly>${esc(courseText(code, type, days))}</textarea>
    </div>
    <p class="foot">“나에게 맞는 여행이, 지역에는 새로운 가치가 되도록.”<br>BUCHEON TOGETHER</p>
  </section>`;
  missions.forEach(m => $('#' + m.id).onchange = e => {
    S.done[m.id] = e.target.checked; store.set('done', S.done);
    $('#pts').textContent = MISSIONS.reduce((a, x) => a + (S.done[x.id] ? x.p : 0), 0) + 'P';
  });
  setActions(`<button class="btn ghost" id="again">처음부터</button><button class="btn ghost" id="shuffle">다른 코스</button><button class="btn" id="share">코스 복사</button>`);
  $('#again').onclick = () => { S.mbti = {EI:null,SN:null,TF:null,JP:null}; S.interests = []; go(0); };
  $('#shuffle').onclick = () => { S.seed++; renderResult(); window.scrollTo(0, 0); toast('다른 조합으로 코스를 바꿨어요'); };
  $('#share').onclick = () => {
    const text = courseText(code, type, days), box = $('#sharebox');
    navigator.clipboard && navigator.clipboard.writeText(text).then(() => toast('코스를 복사했어요'), () => fallback());
    if (!navigator.clipboard) fallback();
    function fallback() { box.hidden = false; const t = $('#copytext'); t.focus(); t.select(); toast('텍스트를 길게 눌러 복사하세요'); }
  };
}

function go(step) {
  S.step = step; setSteps();
  [renderIntro, renderStep1, renderStep2, renderResult][step]();
  window.scrollTo(0, 0);
}
go(0);
</script>
